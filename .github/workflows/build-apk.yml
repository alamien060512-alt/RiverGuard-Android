
name: Build RiverGuard APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: RiverGuard/mobile
        shell: cmd
        run: npm install

      - name: Run build script
        working-directory: RiverGuard/mobile
        shell: cmd
        run: call build-apk.bat

      - name: Build APK
        working-directory: RiverGuard/mobile/android
        shell: cmd
        run: gradlew.bat assembleDebug --stacktrace

      - name: Find APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem `
            -Path "RiverGuard/mobile/android" `
            -Filter "*.apk" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]'
            }

          if (-not $apk) {
            throw "No APK found. Check the Gradle build logs."
          }

          New-Item -ItemType Directory -Path "release-apks" -Force | Out-Null

          foreach ($file in $apk) {
            Copy-Item $file.FullName "release-apks" -Force
            Write-Host "Found APK: $($file.FullName)"
          }

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: RiverGuard-Mobile-v${{ github.run_number }}
          name: RiverGuard Mobile v${{ github.run_number }}
          body: "Automatically built RiverGuard Android APK."
          files: release-apks/*.apk
          fail_on_unmatched_files: true
