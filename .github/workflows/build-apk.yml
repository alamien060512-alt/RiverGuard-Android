name: Build Mobile APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Run build script
        working-directory: RiverGuard/mobile
        run: .\build-apk.bat

      # Target the specific compiled .apk files inside the generated Android build folder
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiverGuard-Mobile-APK-v${{ github.run_number }}
          path: RiverGuard/mobile/android/app/build/outputs/apk/**/*.apk
