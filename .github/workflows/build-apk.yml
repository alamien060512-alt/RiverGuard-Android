
name: Build Mobile APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Build Android APK
        working-directory: RiverGuard/mobile
        shell: cmd
        run: build-apk.bat

      - name: Find generated APK files
        id: find-apk
        shell: pwsh
        run: |
          $root = "RiverGuard/mobile"

          $apks = @(
            Get-ChildItem -Path $root `
              -Filter "*.apk" `
              -Recurse `
              -File |
              Where-Object {
                $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]'
              }
          )

          if ($apks.Count -eq 0) {
            Write-Host "No APK was found."
            Write-Host "Searching for Android build outputs..."

            Get-ChildItem -Path $root -Recurse -Directory |
              Where-Object {
                $_.FullName -match 'build[\\/]outputs'
              } |
              Select-Object -ExpandProperty FullName

            Write-Error "APK build failed or the output path is different."
            exit 1
          }

          $files = @(
            $apks | ForEach-Object { $_.FullName }
          )

          "files<<EOF" >> $env:GITHUB_OUTPUT
          $files | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          foreach ($apk in $apks) {
            Write-Host "APK found: $($apk.FullName)"
          }

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: RiverGuard-Mobile-v${{ github.run_number }}
          name: RiverGuard Mobile v${{ github.run_number }}
          body: |
            ## RiverGuard Mobile

            Automatically built Android APK.

            - Commit: ${{ github.sha }}
            - Build: ${{ github.run_number }}
          files: ${{ steps.find-apk.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
