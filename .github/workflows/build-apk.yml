name: Build RiverGuard APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Verify Android SDK
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) {
            if ($env:ANDROID_SDK_ROOT) {
              $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
            } else {
              throw "Android SDK was not found on the runner."
            }
          }

          Write-Host "Android SDK: $env:ANDROID_HOME"

          if (-not (Test-Path $env:ANDROID_HOME)) {
            throw "Android SDK directory does not exist: $env:ANDROID_HOME"
          }

      - name: Install mobile dependencies
        working-directory: RiverGuard/mobile
        shell: cmd
        run: npm install

      - name: Run existing build script
        working-directory: RiverGuard/mobile
        shell: cmd
        run: call build-apk.bat

      - name: Build debug APK with Gradle
        working-directory: RiverGuard/mobile/android
        shell: cmd
        run: gradlew.bat assembleDebug --stacktrace

      - name: Find and stage APK
        shell: pwsh
        run: |
          $root = "RiverGuard/mobile/android"
          $output = "release-apks"

          $apks = @(
            Get-ChildItem -Path $root -Filter "*.apk" -Recurse -File |
              Where-Object {
                $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]'
              }
          )

          if ($apks.Count -eq 0) {
            Write-Host "No APK found."
            Write-Host "Searching Android build outputs..."

            Get-ChildItem -Path $root -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]build[\\/]outputs'
              } |
              Select-Object -ExpandProperty FullName

            throw "APK was not generated. Check the Gradle build output."
          }

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          foreach ($apk in $apks) {
            $destination = Join-Path $output $apk.Name
            Copy-Item $apk.FullName $destination -Force
            Write-Host "APK staged: $destination"
          }

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: RiverGuard-Mobile-v${{ github.run_number }}
          name: RiverGuard Mobile v${{ github.run_number }}
          body: |
            ## RiverGuard Mobile

            Automatically built Android APK.

            - Commit: ${{ github.sha }}
            - Build number: ${{ github.run_number }}
          files: release-apks/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
