name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' 
          java-version: '21'

      - name: Run build script
        working-directory: RiverGuard/mobile
        run: .\build-apk.bat
