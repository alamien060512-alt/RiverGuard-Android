name: Build 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Run build script
        working-directory: RiverGuard/mobile
        run: .\build-apk.bat

      
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "RiverGuard/mobile/android/app/build/outputs/apk/**/*.apk"
          tag: "v${{ github.run_number }}"
          name: "Release v${{ github.run_number }}"
          body: "Automated build for version ${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
